[project]
name = "backend"
version = "0.1.0"
description = "Backend do Projeto de Laboratório de Sistemas Distribuídos"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi",
    "uvicorn"
]

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.3,<0.17.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
